[package]
name = "celluloid"
version = "0.1.1"
edition = "2021"
description = "Desktop viewer for Celluloid animations"
license = "MIT"
homepage = "https://github.com/careyi3/celluloid"
repository = "https://github.com/careyi3/celluloid"
readme = "README.md"
keywords = ["animation", "visualization", "debugging", "advent-of-code"]
categories = ["visualization", "command-line-utilities", "development-tools::debugging"]

[dependencies]
celluloid-core = { workspace = true }
celluloid-view = { workspace = true, features = ["native"] }
serde_json = "1.0"
base64 = "0.22"
