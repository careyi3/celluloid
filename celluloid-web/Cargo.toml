[package]
name = "celluloid-web"
version = "0.0.1"
edition = "2021"
description = "Web build of the Celluloid viewer, for embedding in a page"
license = "MIT"
repository = "https://github.com/careyi3/celluloid"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
celluloid-core = { workspace = true }
celluloid-view = { workspace = true }
eframe = { workspace = true, features = ["glow"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
