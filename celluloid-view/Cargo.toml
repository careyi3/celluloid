[package]
name = "celluloid-view"
version = "0.1.1"
edition = "2021"
description = "egui viewer for Celluloid animations"
license = "MIT"
homepage = "https://github.com/careyi3/celluloid"
repository = "https://github.com/careyi3/celluloid"
readme = "README.md"
keywords = ["animation", "egui", "visualization", "debugging"]
categories = ["visualization", "gui"]

[features]
default = ["native"]
native = ["eframe/default"]

[dependencies]
celluloid-core = { workspace = true }
eframe = { workspace = true }

[[example]]
name = "embed"
required-features = ["native"]

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
