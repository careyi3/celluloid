[workspace]
members = ["celluloid-core", "wasm", "server"]
resolver = "2"

[workspace.dependencies]
celluloid-core = { path = "celluloid-core" }
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"
rocket = { version = "0.5", features = ["json"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 1
lto = false
codegen-units = 64
incremental = true
